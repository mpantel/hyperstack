# The supported-configuration matrix — single source of truth.
#
# How to add or remove a cell, and what one costs:
#   docs/development-workflow/ci-matrix.md
#
# Two consumers, so what we claim to support and what we actually test cannot
# drift apart:
#
#   1. CI       — one pipeline cell per entry (`rake hyperstack:matrix:check`
#                 fails if .gitlab-ci.yml and this file disagree).
#   2. Runtime  — Hyperstack::SupportedVersions checks a booting app against
#                 this table; `rake hyperstack:config:check` does the same from
#                 the command line.
#
# Notes on the axes:
#
# * `react` is DERIVED, not selected. It is whatever `react_rails` + `pipeline`
#   deliver: react-rails 2.x bundles React 16.x, react-rails 3.3 bundles 18.2,
#   and the esbuild pipeline takes React from npm instead (19.2). It is recorded
#   here so the table documents the real span, but nothing installs it directly.
# * `ruby` and `rails` are major.minor; a booting app matches on major.minor.
# * `id` names the axes that distinguish a cell from its siblings, and only those.
#   It is `rails<MM>-react<MM>`, with a `-ruby<MM>` suffix added ONLY where two
#   cells would otherwise collide -- today those are the Rails 8.0 and Rails 8.1
#   pairs, each run on both Ruby 4.0 and Ruby 3.4. Every other cell's Ruby is in its `ruby:`
#   field and nowhere else, so an unsuffixed id never means a particular Ruby.
#   Ids are consumed by CI alone (image tag and cache key); the runtime check
#   matches on the `ruby`/`rails` fields, so renaming one costs an image rebuild
#   and nothing more. (#80)
# * `pipeline` records how Opal/assets are delivered. The *JavaScript* pipeline
#   for React is selected separately, by exporting HYPERSTACK_JS_PIPELINE in a
#   cell's env: both the install generator and rails-hyperstack's test-app
#   harness read it, so they cannot disagree. Declared explicitly rather than
#   inferred from the Rails version, so a cell states what it runs. (#51)
# * `env` is what CI exports for the cell, resolved by `rake hyperstack:cell:env`.
#   It is applied after the pipeline's own variables, so a cell overrides the
#   global default (OPAL_VERSION) and leaving a variable out takes the gemspec's
#   default -- which is why the cell describing today's configuration has an
#   empty env and is a no-op.
#   A version selector left EMPTY (`RAILS_VERSION: ""`, or a bare key with no
#   value, which YAML reads as nil) means the same thing as omitting it: take the
#   gemspec default. The gemspecs read these through Hyperstack.version_selector,
#   which treats blank as unset, so neither spelling can reach Bundler as the
#   requirement '' any more. (#78)
# * A selector does not need a cell entry to be worth having. PG_VERSION is one
#   no cell sets: the gemspecs' own `< 2` is what pins pg, the driver for the
#   database the specs run against, which until #102 was unpinned -- so a new pg
#   major could have landed with no commit of ours, on the Rails 6.1 cells whose
#   EOL postgresql_adapter still calls PG::Coder.new with a positional Hash
#   (deprecated in pg since 1.5.0, fixed in Rails 7.2+). The selector is what
#   makes moving that cap for one cell -- when pg 2.0 ships and the Rails 7/8
#   cells want it -- one line here, rather than a gemspec edit that moves every
#   cell at once. It does NOT silence the deprecation warning: that is surfaced on
#   purpose by RUBYOPT=-W:deprecated in .gitlab-ci.yml, and only Rails 6.1
#   leaving the matrix ends it. (#102)
#
name: hyperstack supported configurations
cells:
  - id: rails61-react16
    ruby:        "3.4"
    rails:       "6.1"
    opal:        "1.8"
    react_rails: "2.6"
    pipeline:    sprockets
    react:       "16.14"   # derived: bundled by react-rails 2.x
    env:
      # Rails and react-rails are pinned explicitly now that the gemspec
      # defaults span the whole matrix (rails < 9.0, react-rails < 4.0).
      # This cell used to reach 6.1 / 2.6 by taking those defaults, so
      # widening them would have floated it off both axes. (#20)
      RAILS_VERSION: "~> 6.1.0"
      REACT_RAILS_VERSION: "~> 2.6.0"
      HYPERSTACK_JS_PIPELINE: webpacker

  # React 17 takes the SAME hyper-component code path as 16 -- neither has
  # ReactDOM.createRoot, so both use ReactDOM.render/findDOMNode. So this cell is
  # not about new component code: it covers the react-rails 2.7 integration,
  # which edge's default pin (`< 2.7.0`) deliberately excludes. Costs no code
  # change, only a version selection. (#51)
  - id: rails61-react17
    ruby:        "3.4"
    rails:       "6.1"
    opal:        "1.8"
    react_rails: "2.7"
    pipeline:    sprockets
    react:       "17.0.2"  # derived: bundled by react-rails 2.7.x
    env:
      RAILS_VERSION: "~> 6.1.0"   # explicit since the gemspec cap widened (#20)
      REACT_RAILS_VERSION: "~> 2.7.1"
      HYPERSTACK_JS_PIPELINE: webpacker

  # The first cell to take hyper-component's `createRoot` path rather than the
  # legacy ReactDOM.render one -- React 18 removed `render`. react-rails 3.3
  # bundles React 18.2 and serves it through sprockets, so this also covers a
  # delivery route nothing else tests (rails-7+ take React from npm via esbuild).
  # (#51)
  - id: rails61-react18
    ruby:        "3.4"
    rails:       "6.1"
    opal:        "1.8"
    react_rails: "3.3"
    pipeline:    sprockets
    react:       "18.2"   # derived: bundled by react-rails 3.3
    env:
      RAILS_VERSION: "~> 6.1.0"   # explicit since the gemspec cap widened (#20)
      REACT_RAILS_VERSION: "~> 3.3"
      HYPERSTACK_JS_PIPELINE: webpacker

  # The first cell to move the RAILS axis. Everything else is held constant --
  # react-rails 2.6 / React 16.14 on sprockets, exactly as rails61-react16 -- so
  # a failure here is a Rails-version failure and nothing else. The JS pipeline
  # must change with it (Rails 7 has no webpacker:install), which is selected
  # explicitly via HYPERSTACK_JS_PIPELINE rather than inferred. (#51)
  - id: rails72-react16
    ruby:        "3.4"
    rails:       "7.2"
    opal:        "1.8"
    react_rails: "2.6"
    pipeline:    sprockets
    react:       "16.14"
    env:
      REACT_RAILS_VERSION: "~> 2.6.0"  # explicit since the gemspec cap widened (#20)
      RAILS_VERSION: "~> 7.2"
      OPAL_RAILS_VERSION: "~> 2.0"
      # Rails 7 has no webpacker:install; the generator and the test-app harness
      # both read this, so the app is scaffolded and precompiled with esbuild +
      # jsbundling instead. Declared rather than inferred, like every other cell.
      HYPERSTACK_JS_PIPELINE: esbuild

  # The React 19 cell (#40). React comes from npm, bundled by esbuild into every
  # gem's spec/test_app -- selected by HYPERSTACK_REACT_SOURCE=npm, applied by
  # ruby/test_app_react_source.rb at `rake spec:prepare`. This is the only way to
  # reach React 19: react-rails tops out at 3.3 / React 18.2, so before this cell
  # the React axis was frozen at 18 no matter what the table said.
  #
  # react-rails 3.3 is STILL required even though React does not come from it: it
  # also ships react_ujs, the mount/unmount shim rails-hyperstack.rb js_imports
  # for every app, and that has to match the React major. Pinning only the npm
  # React and leaving react-rails at the gemspec default (the React 16 era)
  # produced 185 x "Minified React error #525" across the suite. Both halves are
  # needed.
  #
  # REACT_NPM_VERSION is pinned to the 19.2 series, not `^19.0.0`: cell_contract_spec
  # asserts the browser's window.React.version matches `react:` below, and a
  # caret range would silently float onto 19.3 and fail it.
  #
  # HYPERSTACK_JS_PIPELINE is esbuild here, unlike the other rails61 cells: it is
  # what rails-hyperstack's harness and the install generator read, so the app
  # THEY generate is built the same way the committed test_apps now are.
  - id: rails61-react19
    ruby:        "3.4"
    rails:       "6.1"
    opal:        "1.8"
    react_rails: "3.3"
    pipeline:    sprockets
    react:       "19.2"   # derived: npm via esbuild, not react-rails' bundled 18.2
    env:
      RAILS_VERSION: "~> 6.1.0"   # explicit since the gemspec cap widened (#20)
      REACT_RAILS_VERSION: "~> 3.3"
      HYPERSTACK_REACT_SOURCE: "npm"
      REACT_NPM_VERSION: "~19.2.0"
      HYPERSTACK_JS_PIPELINE: esbuild

  # Rails 7.2 with React 19 -- the combination ru/hyperstack-addons actually
  # ships, and until this cell the one hole in the table that a published gem
  # line fell through.
  #
  # Rails 7.2 appeared once (rails72-react16, on React 16.14) and React 19 three
  # times (6.1, 8.0, 8.1), never together -- so both axes were tested either side
  # of this point and never at it. `rails-hyperstack`
  # 1.0.alpha1.8.34.18.72.1902.x, whose version digits read Ruby 3.4 / Opal 1.8 /
  # Rails 7.2 / React 19.02, is what hyperstack-addons depends on and releases
  # against (hyperstack-addons 34.18.72.1902.x).
  #
  # The gap surfaced from that side: ru/hyperstack-addons#34 ports this matrix
  # machinery, and its cells carry an `upstream_cell` naming the hyperstack cell
  # they correspond to. The addons rails72-react19 cell had to be recorded as `~`
  # because no upstream cell matched -- pointing it at the near-miss
  # rails72-react16 would have claimed coverage of a React that is not the one
  # being run, which that check rejects. This cell is what the field can now name.
  #
  # It is the union of two cells that already pass, and introduces no new
  # mechanism: the Rails axis and OPAL_RAILS_VERSION come from rails72-react16,
  # the React axis (npm via esbuild, plus react-rails 3.3 for react_ujs) from
  # rails61-react19. So a failure here is specifically a Rails-7.2-with-React-19
  # interaction -- which is the thing worth learning, because neither neighbouring
  # cell can show it.
  #
  # opal-rails 2.x is kept rather than the opal-sprockets swap: its `rails < 7.3`
  # cap still admits 7.2, so this cell needs none of the Rails 8 asset work. (#20)
  #
  # REACT_NPM_VERSION pins the 19.2 series rather than `^19.0.0` for the same
  # reason rails61-react19 does: cell_contract_spec asserts the browser's
  # window.React.version against `react:` below, and a caret range would float
  # onto 19.3 and fail it. (#95)
  - id: rails72-react19
    ruby:        "3.4"
    rails:       "7.2"
    opal:        "1.8"
    react_rails: "3.3"       # for react_ujs; React itself comes from npm
    pipeline:    sprockets
    react:       "19.2"      # derived: npm via esbuild, pinned by REACT_NPM_VERSION
    env:
      RAILS_VERSION: "~> 7.2"
      OPAL_RAILS_VERSION: "~> 2.0"
      REACT_RAILS_VERSION: "~> 3.3"
      HYPERSTACK_REACT_SOURCE: "npm"
      REACT_NPM_VERSION: "~19.2.0"
      HYPERSTACK_JS_PIPELINE: esbuild

  # The Rails 8 / Ruby 4 corner, and the first cell to move THREE axes at once --
  # so unlike the cells above it is not a single-variable experiment. It exists
  # because that is the combination the rails-8.0 branch line was built and
  # released against (`backup/rails-8.0` declares exactly this cell); folding it
  # into the matrix is what lets one gem serve that line instead of a separate
  # branch. (#20, #15, #51)
  #
  # It is rails61-react19 above plus Ruby 4 and Rails 8: the React axis is reached
  # exactly the same way (HYPERSTACK_REACT_SOURCE=npm), so React 19 is not a third
  # thing being proved here. What IS new and selected, not inferred:
  #
  # * Ruby 4.0.5 via RBENV_VERSION. base24:yjit already ships it (it is that
  #   image's default ruby), so no infrastructure change is needed -- but the
  #   global RBENV_VERSION in .gitlab-ci.yml is 3.4.9, and only a cell's own env
  #   can move it, which is why it is spelled out here. (#15)
  # * Opal reaches sprockets through opal-sprockets rather than opal-rails:
  #   opal-rails 2.x is hard-capped at `rails < 7.3` so it cannot resolve at all
  #   on Rails 8, and opal-rails 3.0 replaces the sprockets processor with an
  #   app/opal entrypoint build (a separate change, #37). Setting
  #   OPAL_SPROCKETS_VERSION is what swaps the dependency; the Rails wiring
  #   opal-rails' engine used to provide is ported into hyperstack/rail_tie and
  #   activates only when opal-rails is absent. (#20)
  # * SQLITE3_VERSION, because Rails 8's SQLite3 adapter needs sqlite3 2.x and the
  #   gemspecs pin `< 2` for the Rails 6.1 cells, which cannot use it.
  - id: rails80-react19-ruby40
    ruby:        "4.0"
    rails:       "8.0"
    opal:        "1.8"
    react_rails: "3.3"       # for react_ujs; React itself comes from npm
    pipeline:    sprockets   # Opal assets via opal-sprockets; React via esbuild
    react:       "19.2"      # derived: npm react, pinned by REACT_NPM_VERSION
    env:
      RBENV_VERSION: "4.0.5"
      RAILS_VERSION: "~> 8.0.0"
      OPAL_SPROCKETS_VERSION: "~> 1.0"
      SQLITE3_VERSION: ">= 2.1"
      REACT_RAILS_VERSION: "~> 3.3"
      HYPERSTACK_REACT_SOURCE: "npm"
      REACT_NPM_VERSION: "~19.2.0"
      HYPERSTACK_JS_PIPELINE: esbuild

  # Rails 8.0 on Ruby 3.4 -- the same cell as above with the Ruby axis moved,
  # and the reason the two ids now name their Ruby.
  #
  # It exists so the Rails 8 corner of the matrix is a one-variable grid again:
  # this cell and rails81-react19-ruby34 differ only in Rails, this cell and
  # rails80-react19-ruby40 differ only in Ruby. Without it, moving the 8.1 cell
  # to Ruby 3.4 left every Rails 8 comparison crossing two axes at once.
  #
  # It is also the configuration most Rails 8 users are actually on: Rails 8.0
  # requires ruby >= 3.2, and Ruby 4.0 adoption lags Rails 8 adoption. (#80)
  - id: rails80-react19-ruby34
    ruby:        "3.4"
    rails:       "8.0"
    opal:        "1.8"
    react_rails: "3.3"       # for react_ujs; React itself comes from npm
    pipeline:    sprockets   # Opal assets via opal-sprockets; React via esbuild
    react:       "19.2"      # derived: npm react, pinned by REACT_NPM_VERSION
    env:
      # no RBENV_VERSION: takes the global 3.4.9 from .gitlab-ci.yml.
      RAILS_VERSION: "~> 8.0.0"
      OPAL_SPROCKETS_VERSION: "~> 1.0"
      SQLITE3_VERSION: ">= 2.1"
      REACT_RAILS_VERSION: "~> 3.3"
      HYPERSTACK_REACT_SOURCE: "npm"
      REACT_NPM_VERSION: "~19.2.0"
      HYPERSTACK_JS_PIPELINE: esbuild

  # Rails 8.1 on Ruby 3.4.
  #
  # With rails81-react19-ruby40 below, the Rails 8 corner is a complete 2x2 grid
  # -- {rails 8.0, 8.1} x {ruby 3.4, 4.0} -- so every comparison across it moves
  # exactly one axis again. This cell and rails80-react19-ruby34 differ only in
  # Rails; this cell and rails81-react19-ruby40 differ only in Ruby.
  #
  # That resolves the two-axis compromise this comment used to record under
  # #80/#92: Rails 8.1 was tested only on Ruby 3.4 and Rails 8.0 only on Ruby 4.0,
  # so a failure on either was not attributable to one version. It no longer has
  # to be traded away -- a failure here is a Rails-version failure once more.
  #
  # This cell remains the configuration most Rails 8.1 users are actually on:
  # Rails 8.1 requires ruby >= 3.2, and Ruby 4.0 adoption lags Rails 8 adoption.
  #
  # It exists because the rails axis span is derived from these cells, so with 8.0
  # as the maximum a Rails 8.1 app is reported :unsupported rather than :untested --
  # off the map entirely, on a release one minor above a cell we run green.
  #
  # None of #20's Rails 8 work needs repeating, because all of it is keyed on the
  # Rails MAJOR: hyper-spec's `routes.append` registration is gated on
  # `Rails::VERSION::MAJOR >= 8`, spec_prepare_gems' `legacy_rails?` on `major < 7`,
  # and opal-sprockets declares no rails dependency at all -- unlike opal-rails,
  # which is hard-capped at `rails < 7.3` and is why the swap exists.
  #
  # RAILS_VERSION is `~> 8.1.0` (>= 8.1.0, < 8.2.0), matching how the 8.0 cells
  # pin `~> 8.0.0`: each Rails cell stays on its own minor series rather than
  # floating onto the next one.
  - id: rails81-react19-ruby34
    ruby:        "3.4"
    rails:       "8.1"
    opal:        "1.8"
    react_rails: "3.3"       # for react_ujs; React itself comes from npm
    pipeline:    sprockets   # Opal assets via opal-sprockets; React via esbuild
    react:       "19.2"      # derived: npm react, pinned by REACT_NPM_VERSION
    env:
      # no RBENV_VERSION: this cell takes the global 3.4.9 from .gitlab-ci.yml,
      # like every other Ruby 3.4 cell. Only the -ruby40 cells override it.
      RAILS_VERSION: "~> 8.1.0"
      OPAL_SPROCKETS_VERSION: "~> 1.0"
      SQLITE3_VERSION: ">= 2.1"
      REACT_RAILS_VERSION: "~> 3.3"
      HYPERSTACK_REACT_SOURCE: "npm"
      REACT_NPM_VERSION: "~19.2.0"
      HYPERSTACK_JS_PIPELINE: esbuild

  # Rails 8.1 on Ruby 4.0 -- the newest supported Rails on the newest Ruby, and
  # the cell that completes the Rails 8 grid.
  #
  # Until this cell, the matrix ran Ruby 4.0 only on Rails 8.0 and Rails 8.1 only
  # on Ruby 3.4, so their intersection was never run. That intersection is not an
  # exotic corner: it is what a user on the newest of both is on, and
  # SupportedVersions classified it :untested rather than :supported precisely
  # because no cell covered it.
  #
  # It is also the exact configuration #38's client-runtime failures were reported
  # against (Ruby 4.0.5 / Rails 8.1.3, on the old rails-8 branch line). Those were
  # closed on the evidence that both axes pass independently -- which is the most
  # the matrix could say without this cell. Now the combination itself is a gate.
  #
  # Ruby 4.0.5 via RBENV_VERSION, exactly as rails80-react19-ruby40 does it:
  # base24:yjit already ships it, and only a cell's own env can move the global
  # RBENV_VERSION 3.4.9 in .gitlab-ci.yml.
  #
  # This takes the matrix to 9 cells, against the "without growing the matrix"
  # note that #58 prompted. Deliberately: #58's actual answer is a reduced default
  # matrix with the full one on protected branches and on demand, which makes the
  # raw cell count the wrong thing to economise on -- and the cost of the gap is
  # paid on the combination users are most likely to hit. (#38, #58, #80)
  - id: rails81-react19-ruby40
    ruby:        "4.0"
    rails:       "8.1"
    opal:        "1.8"
    react_rails: "3.3"       # for react_ujs; React itself comes from npm
    pipeline:    sprockets   # Opal assets via opal-sprockets; React via esbuild
    react:       "19.2"      # derived: npm react, pinned by REACT_NPM_VERSION
    env:
      RBENV_VERSION: "4.0.5"
      RAILS_VERSION: "~> 8.1.0"
      OPAL_SPROCKETS_VERSION: "~> 1.0"
      SQLITE3_VERSION: ">= 2.1"
      REACT_RAILS_VERSION: "~> 3.3"
      HYPERSTACK_REACT_SOURCE: "npm"
      REACT_NPM_VERSION: "~19.2.0"
      HYPERSTACK_JS_PIPELINE: esbuild
