version: '3.5'

volumes:
  local_gems:
    external: true
    name: local_gems
#  rails_cache:
#  node_modules:
#  packs:
#  packs-test:

networks:
  default:
    name: development_network
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: ${CONTAINER_SUBNET}


services:
  #############################
  # Setup the base containers #
  #############################

  hyperstack:
    image: ${PRIVATE_REGISTRY}/base20:hyperstack
    domainname: ${BASE_TEST_DOMAIN}
    hostname: hyperstack
    container_name: "hyperstack"
    entrypoint: ./runone
    stdin_open: true
    user: user
    tty: true
    working_dir: /home/user/hyperstack
    environment:
      BUNDLE_PATH: "/home/user/local_gems"
      DRIVER: "${DRIVER}"
      COMPONENT: "${COMPONENT}"
      RUBY_VERSION: "${RUBY_VERSION}"
      TASK: "${TASK}"
      DB: "${DB}"
    volumes:
      - ${MOUNT_PATH:-..}/hyperstack:/home/user/hyperstack
#      - local_gems:/home/user/local_gems
    networks:
      default:
