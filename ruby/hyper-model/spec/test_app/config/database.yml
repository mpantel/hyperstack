# SQLite version 3.x
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem 'sqlite3'
#
# default: &default
#   adapter: mysql2
#   encoding: utf8
#   username: root
#
# development:
#   <<: *default
#   database: hyper_mesh_development_db
#
# test:
#   <<: *default
#   database: hyper_mesh_test_db
#
# production:
#   <<: *default
#   database: hyper_mesh_production_db

default: &default
  adapter: postgresql
  pool: 5
  timeout: 5000

development:
  <<: *default
  database: hyper_mesh_development_db

test:
  <<: *default
  # Parallel specs: the spec:parallel pool assigns each process a TEST_ENV_NUMBER
  # ('' for the first, '2', '3', ... for the rest), giving each its own DB.
  # Unset/empty -> hyper_mesh_test_db, so serial runs are unchanged.
  database: hyper_mesh_test_db<%= ENV['TEST_ENV_NUMBER'] %>

production:
  <<: *default
  database: hyper_mesh_production_db
