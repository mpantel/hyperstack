image:
  name: ${PRIVATE_REGISTRY}/base20:hyperstack
  docker:
    user: user

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_MESSAGE =~ /\[ci build]/i
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =='master'

variables:
  TERM: ansi
  MOUNT_PATH: /home/michail
  CONTAINER_SUBNET: 192.168.48.0/24

  PGUSE: postgres
  PGPORT: 5432
  PGHOST: localhost

#services:
#  - docker:27.3.1-dind

# script:

# default:
#   before_script:
#     - docker info

# Cache gems in between builds
default:
  cache:
    paths:
      - local_gems
      - node_modules

stages:
  #  - databases
  #  - prepare
  #  - check
  - test
#  - report
#  - approve
#  - deploy

.test_gem_pg: &_test_gem_pg
  stage: test

  before_script:
    - sudo sed -i -e '/local.*peer/s/postgres/all/' -e 's/peer\|md5/trust/g' /etc/postgresql/*/main/pg_hba.conf
    - sudo service postgresql restart
    - sleep 1
    - postgres --version
    - sudo rm -f /usr/local/bin/yarn
    - nvm install 10
    - rvm install 2.6.3  # was 2.5.1
    - gem install bundler
    - ln -s /usr/lib/chromium-browser/chromedriver ~/bin/chromedriver
    - echo 'install completed'

    - echo before_script $COMPONENT
    - echo updating chrome driver
    - cd ruby/$COMPONENT
    - echo creating psql database
    - psql -c 'create database hyper_mesh_test_db;' -U postgres
    - bundle install --jobs=3 --retry=3
    - bundle exec ruby -e 'require "webdrivers";  Webdrivers::Chromedriver.update; puts Webdrivers::Chromedriver.current_version'
    - ls -la ~/.webdrivers
    - sudo cp  ~/.webdrivers/chromedriver /usr/lib/chromium-browser/chromedriver
    - bundle exec rake spec:prepare
    - google-chrome --version
    - which google-chrome
    - yarn install

  script:
    - echo running script $COMPONENT
    - DRIVER=travis bundle exec rake $TASK

.test_gem: &_test_gem
  stage: test

