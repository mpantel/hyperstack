# install ruby 3.0.7 on mac
# export RUBY_CONFIGURE_OPTS="--with-openssl-dir=$(brew --prefix openssl@3)"
# rbenv install 3.0.7

image:
  name: ${PRIVATE_REGISTRY}/base24:yjit
  docker:
    user: ubuntu

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_MESSAGE =~ /\[ci build]/i
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =='master'

variables:
  TERM: ansi
  MOUNT_PATH: /home/michail
  CONTAINER_SUBNET: 192.168.48.0/24

  PGUSE: postgres
  PGPORT: 5432
  PGHOST: localhost
#  RUBYOPT: "-W0"
  RUBYOPT: "-W:deprecated"

  OPAL_VERSION: 1.5.1
  RBENV_VERSION: 3.2.9
  RUBY_YJIT_ENABLE: "1"
