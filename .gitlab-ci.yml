# Guards the "one table, two consumers" contract from #51: the cells declared in
# supported_versions.yml must be exactly the cells CI runs. Cheap, no services.
supported-versions:
  # Deliberately does NOT extend .test_gem: that template now carries the
  # per-cell `parallel: matrix:` axis, and this check is about the table itself,
  # so it should run once per pipeline rather than once per cell.
  interruptible: true
  stage: test
  variables:
    COMPONENT: hyperstack-config
  before_script:
    - echo "checking supported_versions.yml against the pipeline"
  script:
    # The SupportedVersions specs themselves run in the hyperstack-config job,
    # which has a bundle; this job only needs rake and the two files.
    - rake hyperstack:matrix:check

hyper-spec:
  extends: .test_gem
  variables:
    COMPONENT: hyper-spec
# One job runs all 7 batches in PARALLEL across a pool of PARALLEL_PROCESSES
# databases, with the Opal bundle precompiled once (see ruby/hyper-model/Rakefile
# spec:parallel). Set PARALLEL_SPECS: "0" to fall back to the serial path
# (all batches in one process). part1..part7 remain as ad-hoc per-batch rake tasks.
hyper-model:
  extends: .test_gem_pg
  rules: [{ when: never }]   # CONTROL (#64)
  variables:
    COMPONENT: hyper-model
    TASK: spec
    DB: hyper_mesh_test_db
    PRECOMPILED_ASSETS: "1"
    PARALLEL_PROCESSES: "4"
hyper-trace:
  extends: .test_gem
  rules: [{ when: never }]   # CONTROL (#64)
  variables:
    COMPONENT: hyper-trace
hyperstack-config:
