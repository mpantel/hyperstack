.test_gem_pg:
  interruptible: true
  stage: test
  # Run on this cell's prebaked dependency image instead of base24 + a restored
  # gem cache. The image bakes `local_gems` (every gem's bundle, including
  # compiled native extensions) for exactly this cell's version selectors, built
  # from supported_versions.yml by the same `rake hyperstack:cell:env` this job
  # uses -- so the image and the test run cannot disagree about which versions
  # they are. (#57)
  image:
    name: $CI_REGISTRY_IMAGE/cell:$HYPERSTACK_CELL
    docker:
      user: ubuntu
  # No gem cache: the gems are in the image. Measured on job 40440, keeping it
  # would cost 19-58s restoring 258 MB over gems already present, plus ~28s
  # re-uploading them (`policy: pull-push`, `when: always`) -- ~47s/job of pure
  # waste. The `yarn-v1` cache from `default:` still applies: node packages are
  # NOT in the image.
  cache: []
  # Retry the whole job once, but ONLY for failures that are never the code's
  # fault. `script_failure` is deliberately NOT retried.
  #
  # It was originally included (!72) on the belief that browser specs were
  # failing to environment-level flakiness that in-process rspec-retry could not
  # absorb. That diagnosis was wrong: the failures were the runner running out of
  # disk (#56, ru/infrastructure#7) -- Postgres, Rails logging and hyper-spec's
  # cache all failing to write, and Chrome dying with it. With the cause handled
  # in infrastructure, retrying `script_failure` no longer absorbs flakiness; it
  # hides genuine test failures and, worse, would quietly paper over the next
  # resource exhaustion instead of letting it fail loudly.
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure


  # One job per configuration in supported_versions.yml. The pipeline only names
  # cells; their values live in the table and are resolved by
  # `rake hyperstack:cell:env`, so the two cannot drift.
  # `rake hyperstack:matrix:check` fails if this list and the table disagree. (#51)
  parallel:
    matrix:
      - HYPERSTACK_CELL: [rails61-react16, rails61-react17, rails61-react18, rails61-react19, rails72-react16]

  before_script:
    # - sudo sed -i -e '/local.*peer/s/postgres/all/' -e 's/peer\|md5/trust/g' /etc/postgresql/*/main/pg_hba.conf
    # - sudo service postgresql restart
    # - sleep 1
    # - postgres --version
    # - sudo rm -f /usr/local/bin/yarn
    # - nvm install 10
    # - rvm install 2.6.3  # was 2.5.1
    # - gem install bundler
    # - ln -s /usr/lib/chromium-browser/chromedriver ~/bin/chromedriver
    # - echo 'install completed'

    - sudo service postgresql start
    - until pg_isready --username=postgres --host=localhost; do sleep 1; done
    - sudo redis-server --daemonize yes

    - git config --global --add safe.directory $CI_PROJECT_DIR

    - echo "cell $HYPERSTACK_CELL"
    - eval "$(rake hyperstack:cell:env)"
    # Gems come from the image, not from restore_cache. Fail loudly rather than
    # silently falling back to a cold `bundle install`, which would look like a
    # slow but successful job and hide a broken or missing image.
    - test -d "$HYPERSTACK_PREBAKED_GEMS" || { echo "image $CI_REGISTRY_IMAGE/cell:$HYPERSTACK_CELL has no prebaked gems at $HYPERSTACK_PREBAKED_GEMS"; exit 1; }
    - ln -sfn "$HYPERSTACK_PREBAKED_GEMS" "$CI_PROJECT_DIR/local_gems"

# - bundle config set --local path local_gems
    # - bundle install

    - echo initialized for $COMPONENT
    - cd ruby/$COMPONENT

    - echo creating psql database
    - psql -c 'create database hyper_mesh_test_db;' -U postgres

    - gem install bundler -v '~> 4.0'
    - bundle -v   # confirm the activated Bundler (#36)
    - bundle config set --local path ../../local_gems

    - bundle install --jobs=3 --retry=3
    - google-chrome --version
    - bundle exec rake spec:prepare
    - ln -s /node_modules/ ../../node_modules
    - yarn install
#    - cd spec/test_app
#    - bundle exec rails assets:precompile
#    - cd ../..
    - bundle list
    - echo 'install completed'

  script:
    - echo running script $COMPONENT
    - DRIVER=travis bundle exec rake $TASK

