# Cache gems between pipelines, per component and Ruby version.
#
# NOTE (#57): the matrix test jobs no longer use this. `.test_gem` and
# `.test_gem_pg` run on prebaked cell images that already contain `local_gems`
# and override this with `cache: []`. What follows still governs the jobs that
# run on base24 -- `supported-versions` and the `.deploy_gem` jobs -- which are
# not per-cell and so have no image to inherit gems from.
#
# `key: gems-$COMPONENT-$RBENV_VERSION` gives each component its own cache, so the
# ~13 parallel jobs don't clobber a single shared key (default cache policy is
# pull-push); part1/part2 of a component share one key. The Ruby version is part
# of the key because `local_gems` holds *installed* gems including compiled C
# extensions — a cache built on one Ruby ABI must not be restored into a job on a
# different Ruby (e.g. the 3.2 → 3.3 → 3.4 line), or native extensions mismatch.
# This also makes the cache safe to share across runners (a shared volume / S3
# distributed cache). We cache only `local_gems` (the bundler `--path`): node
# packages are baked into the image at /node_modules and symlinked in (see
# before_script), so there is nothing useful to cache for node and the path would
# just be a dangling symlink.
default:
  # Two independent caches, because they have different lifetimes.
  #
  # Gems are per (component, ruby, cell): a cell deliberately installs a
  # different gem set, and local_gems holds *installed* gems including compiled
  # C extensions, so a cache built on one Ruby ABI must never be restored into a
  # job on another. (#55)
  #
  # The yarn download cache is none of those things. npm packages do not depend
  # on the Ruby version, the Rails version or which react-rails gem a cell
  # selects, so scoping it the same way would keep ~48 near-identical copies and
  # hand every new cell a cold cache. One shared key instead: the yarn cache is
  # content-addressed, so entries from different jobs coexist rather than
  # conflict, and every job warms it for every other. Bump the suffix to
  # invalidate by hand.
  cache:
    - key: "gems-$COMPONENT-$RBENV_VERSION-$HYPERSTACK_CELL"
      paths:
        - local_gems
      policy: pull-push
      # `when: always`, not GitLab's default `on_success`. What lands in
      # local_gems is decided by the Gemfile/lockfile and is just as valid when
      # the specs afterwards go red -- so with the default, a job that is failing
      # never populates its own cache and every retry re-installs from scratch.
      # Measured on the Rails 7.2 cell: ~219s of setup on each failing iteration
      # against ~90s once it finally passed and the cache existed. That is the
      # cache missing precisely while you are iterating on a red job. (#55)
      when: always
    - key: "yarn-v1"
      paths:
        - .yarn-cache
      policy: pull-push
      # Same reasoning: yarn's download cache is content-addressed, so a partial
      # one is still correct -- it only ever means fewer entries, never wrong
      # entries.
      when: always

stages:
  #  - databases
  #  - prepare
  #  - check
  # Cell images are built before anything consumes them. Ordering matters now
  # that the test jobs RUN on these images: a test job must never start against
  # an image a build job in the same pipeline is still producing. (#57)
  - images
  - test
#  - report
#  - approve
