    # yarn is in /usr/local/bin/yarn version 1.3.2 and is not a package
    # must remove this zombie for new yarn to work
#    - sudo rm -f /usr/local/bin/yarn
#    - nvm install 14
#    - rvm install 2.6.3  # was 2.5.1
#    - gem install bundler

    - sudo service postgresql start
    - until pg_isready --username=postgres --host=localhost; do sleep 1; done
    - sudo redis-server --daemonize yes

    - git config --global --add safe.directory .
    # - bundle config set --local path local_gems
