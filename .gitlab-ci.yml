.deploy_gem: &_deploy_gem
  resource_group: production
  stage: deploy
  before_script:
    - git config --global --add safe.directory $CI_PROJECT_DIR
    - cd ruby/$COMPONENT
  environment:
    name: production
    url: https://gems.ru.aegean.gr
  when: manual
  allow_failure: true
  script:
    - echo deploying $COMPONENT
    - gem build $COMPONENT.gemspec
    - gem push "#{$COMPONENT}-#{Hyperstack::VERSION.tr("'",'')}.gem" ,'--host' ,"https://michail:#{ENV['GEM_SERVER_KEY']}@gems.ru.aegean.gr"
