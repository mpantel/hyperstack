# Cache gems between pipelines, per component and Ruby version.
#
# NOTE (#57): the matrix test jobs no longer use this. `.test_gem` runs on
# prebaked cell images that already contain `local_gems` and overrides this with
# `cache: []`. What follows still governs the jobs that run on base24 --
# `supported-versions` and the `.deploy_gem` jobs -- which are not per-cell and so
# have no image to inherit gems from.
#
# `key: gems-$COMPONENT-$RBENV_VERSION` gives each component its own cache, so the
# ~13 parallel jobs don't clobber a single shared key (default cache policy is
# pull-push); part1/part2 of a component share one key. The Ruby version is part
# of the key because `local_gems` holds *installed* gems including compiled C
# extensions — a cache built on one Ruby ABI must not be restored into a job on a
# different Ruby (e.g. the 3.2 → 3.3 → 3.4 line), or native extensions mismatch.
# This also makes the cache safe to share across runners (a shared volume / S3
# distributed cache). We cache only `local_gems` (the bundler `--path`): node
# packages are baked into the image at /node_modules and symlinked in (see
# before_script), so there is nothing useful to cache for node and the path would
# just be a dangling symlink.
default:
  # Two independent caches, because they have different lifetimes.
  #
  # Gems are per (component, ruby, cell): a cell deliberately installs a
  # different gem set, and local_gems holds *installed* gems including compiled
  # C extensions, so a cache built on one Ruby ABI must never be restored into a
  # job on another. (#55)
  #
  # The yarn download cache is none of those things. npm packages do not depend
  # on the Ruby version, the Rails version or which react-rails gem a cell
  # selects, so scoping it the same way would keep ~48 near-identical copies and
  # hand every new cell a cold cache. One shared key instead: the yarn cache is
  # content-addressed, so entries from different jobs coexist rather than
  # conflict, and every job warms it for every other. Bump the suffix to
  # invalidate by hand.
  cache:
    - key: "gems-$COMPONENT-$RBENV_VERSION-$HYPERSTACK_CELL"
      paths:
        - local_gems
      policy: pull-push
      # `when: always`, not GitLab's default `on_success`. What lands in
      # local_gems is decided by the Gemfile/lockfile and is just as valid when
      # the specs afterwards go red -- so with the default, a job that is failing
      # never populates its own cache and every retry re-installs from scratch.
      # Measured on the Rails 7.2 cell: ~219s of setup on each failing iteration
      # against ~90s once it finally passed and the cache existed. That is the
      # cache missing precisely while you are iterating on a red job. (#55)
      when: always
    - key: "yarn-v1"
      paths:
        - .yarn-cache
      policy: pull-push
      # Same reasoning: yarn's download cache is content-addressed, so a partial
      # one is still correct -- it only ever means fewer entries, never wrong
      # entries.
      when: always

stages:
  #  - databases
  #  - prepare
  #  - check
  # Cell images are built before anything consumes them. Ordering matters now
  # that the test jobs RUN on these images: a test job must never start against
  # an image a build job in the same pipeline is still producing. (#57)
  - images
  - test
#  - report
#  - approve
  - deploy

.test_gem:
  interruptible: true
  stage: test
  # Run on this cell's prebaked dependency image instead of base24 + a restored
  # gem cache. The image bakes `local_gems` (every gem's bundle, including
  # compiled native extensions) for exactly this cell's version selectors, built
  # from supported_versions.yml by the same `rake hyperstack:cell:env` this job
  # uses -- so the image and the test run cannot disagree about which versions
  # they are. (#57)
  image:
    name: $CI_REGISTRY_IMAGE/cell:$HYPERSTACK_CELL
    docker:
      user: ubuntu
  # No cache at all: the gems are in the image. Measured on job 40440, keeping it
  # would cost 19-58s restoring 258 MB over gems already present, plus ~28s
  # re-uploading them (`policy: pull-push`, `when: always`) -- ~47s/job of pure
  # waste.
  #
  # NOTE: `cache: []` REPLACES `default:`'s list, it does not merge with it, so
  # this switches off the `yarn-v1` cache too -- an earlier version of this
  # comment claimed otherwise. Job 44293's trace confirms it: no
  # restore_cache/archive_cache sections, and every yarn run reported "No
  # lockfile found" and refetched. npm packages come from the image instead, via
  # HYPERSTACK_PREBAKED_YARN_CACHE (see before_script). (#75)
  cache: []
  # Retry the whole job once, but ONLY for failures that are never the code's
  # fault. `script_failure` is deliberately NOT retried.
  #
  # It was originally included (!72) on the belief that browser specs were
  # failing to environment-level flakiness that in-process rspec-retry could not
  # absorb. That diagnosis was wrong: the failures were the runner running out of
  # disk (#56, ru/infrastructure#7) -- Postgres, Rails logging and hyper-spec's
  # cache all failing to write, and Chrome dying with it. With the cause handled
  # in infrastructure, retrying `script_failure` no longer absorbs flakiness; it
  # hides genuine test failures and, worse, would quietly paper over the next
  # resource exhaustion instead of letting it fail loudly.
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure


  # Default to no services. `extends:` deep-merges `variables:`, so a job that
  # needs one overrides just that key and inherits the rest. Declared here rather
  # than left unset so the interface is visible in one place and every job's
  # variables list says, in the trace, which services it asked for. (#116)
  variables:
    NEEDS_PG: "0"
    NEEDS_REDIS: "0"
    PG_CREATE_DB: ""

  # One job per configuration in supported_versions.yml. The pipeline only names
  # cells; their values live in the table and are resolved by
  # `rake hyperstack:cell:env`, so the two cannot drift.
  # `rake hyperstack:matrix:check` fails if this list and the table disagree. (#51)
  parallel:
    matrix:
      - HYPERSTACK_CELL: [rails61-react16, rails61-react17, rails61-react18, rails72-react16, rails61-react19, rails72-react19, rails80-react19-ruby40, rails80-react19-ruby34, rails81-react19-ruby34, rails81-react19-ruby40]

#  language: ruby
#  cache:
#    bundler: true
#    directories:
#      - node_modules # NPM packages

#  addons:
#    apt:
#      sources:
#        - sourceline: 'deb http://dl.yarnpkg.com/debian/ stable main'
#          key_url: 'http://dl.yarnpkg.com/debian/pubkey.gpg'
#        - sourceline: 'deb http://dl.google.com/linux/chrome/deb/ stable main'
#          key_url: 'https://dl-ssl.google.com/linux/linux_signing_key.pub'
#      packages:
#        - chromium-chromedriver
#        - google-chrome-stable
#        - yarn
#        - redis-server
#    mariadb: '10.3'
#  services:
#    - redis-server

  before_script:
    - echo installing $COMPONENT
    - eval "$(rake hyperstack:cell:env)"
    # Gems come from the image, not from restore_cache. Fail loudly rather than
    # silently falling back to a cold `bundle install`, which would look like a
    # slow but successful job and hide a broken or missing image.
    - test -d "$HYPERSTACK_PREBAKED_GEMS" || { echo "image $CI_REGISTRY_IMAGE/cell:$HYPERSTACK_CELL has no prebaked gems at $HYPERSTACK_PREBAKED_GEMS"; exit 1; }
    - ln -sfn "$HYPERSTACK_PREBAKED_GEMS" "$CI_PROJECT_DIR/local_gems"
    # npm packages come from the image too (#75). The global YARN_CACHE_FOLDER
    # points into $CI_PROJECT_DIR for the base24 jobs that still cache it;
    # override it here so every yarn the generated app runs -- spec:prepare's
    # included -- reads the cache the image warmed. Same rule as the gems: say so
    # and stop, rather than silently redownloading the whole tree.
    - test -d "$HYPERSTACK_PREBAKED_YARN_CACHE" || { echo "image $CI_REGISTRY_IMAGE/cell:$HYPERSTACK_CELL has no prebaked yarn cache at $HYPERSTACK_PREBAKED_YARN_CACHE"; exit 1; }
    - export YARN_CACHE_FOLDER="$HYPERSTACK_PREBAKED_YARN_CACHE"
#    - sudo apt-get remove --purge mysql-server mysql-client mysql-common
#    - sudo apt-get autoremove
#    - sudo apt-get autoclean
#    - sudo rm -rf /var/lib/mysql
#    - sudo rm -rf /etc/mysql
#    - sudo apt install mariadb-server mariadb-client -y
#    - sudo apt-get install libmysqlclient-dev

    # yarn is in /usr/local/bin/yarn version 1.3.2 and is not a package
    # must remove this zombie for new yarn to work
#    - sudo rm -f /usr/local/bin/yarn
#    - nvm install 14
#    - rvm install 2.6.3  # was 2.5.1
#    - gem install bundler

    # Services are opt-in per job (#116). Until now EVERY test job started a
    # PostgreSQL 16 cluster and a redis-server -- ~2.7s and a resident 7-process
    # cluster in each of the ~10 of 13 components whose test_app is sqlite3 and
    # never opens a socket to either.
    #
    # The wasted seconds were the smaller problem. Starting both everywhere meant
    # a job could DECLARE the wrong services and still pass, and two of them did:
    # hyper-i18n (sqlite3) extended the Postgres template, while hyper-operation
    # -- the one gem needing BOTH Postgres and Redis -- extended the other one.
    # Neither ever failed, because the "wrong" template started the server anyway.
    # Gating on these variables makes the declaration load-bearing, so the next
    # such mismatch fails loudly instead of being absorbed.
    #
    #   NEEDS_PG      "1"  -> start PostgreSQL and wait for it
    #   NEEDS_REDIS   "1"  -> start redis-server
    #   PG_CREATE_DB  name -> also `create database <name>` as postgres
    #
    # PG_CREATE_DB is separate from NEEDS_PG because "needs Postgres" and "needs
    # this database created for it" are genuinely different: hyper-operation's
    # Rakefile runs `rails db:setup` and creates its own, hyper-model expects CI
    # to have made hyper_mesh_test_db first. Setting it implies NEEDS_PG, so the
    # two cannot be set inconsistently.
    - |
      if [ "$NEEDS_PG" = "1" ] || [ -n "$PG_CREATE_DB" ]; then
        sudo service postgresql start
        until pg_isready --username=postgres --host=localhost; do sleep 1; done
      fi
    - if [ "$NEEDS_REDIS" = "1" ]; then sudo redis-server --daemonize yes; fi
    - if [ -n "$PG_CREATE_DB" ]; then echo "creating psql database $PG_CREATE_DB"; psql -c "create database $PG_CREATE_DB;" -U postgres; fi

    - git config --global --add safe.directory $CI_PROJECT_DIR
    # - bundle config set --local path local_gems
    # - bundle install

    - echo initialized for $COMPONENT
    - cd ruby/$COMPONENT

    - gem install bundler -v '~> 4.0'
    - bundle -v   # confirm the activated Bundler (#36)
    - bundle config set --local path ../../local_gems

    - bundle install --jobs=3 --retry=3
    - google-chrome --version
    - bundle exec rake spec:prepare
    - ln -s /node_modules/ ../../node_modules
    - yarn install
#    - cd spec/test_app
#    - bundle exec rails assets:precompile
#    - cd ../..
    - bundle list
    - echo 'install completed'

  # Keep the generated app's server log when a job fails. Chasing #81 cost several
  # full-matrix runs precisely because this did not exist: the browser reported
  # 79 HTTP 500s from the harness route and there was not one backtrace anywhere
  # to say what raised. The client-side symptom is visible in the trace; the
  # server-side cause never is.
  #
  # `when: on_failure` so a green pipeline uploads nothing. Ignore a missing path
  # rather than failing the job over it -- the gems that use a COMMITTED test_app
  # always have one, but rails-hyperstack GENERATES its app at spec:prepare, so
  # when that step is what failed there is no log to collect.
  artifacts:
    when: on_failure
    expire_in: 1 week
    name: "$CI_JOB_NAME-$CI_JOB_ID-logs"
    paths:
      - ruby/*/spec/test_app/log/
    exclude:
      - ruby/*/spec/test_app/log/**/*.gz

  script:
    - echo running script $COMPONENT
    - DRIVER=travis bundle exec rake $TASK

# Manual deploy
# docker run --rm -e RBENV_VERSION=3.0.7 -e "GEM_SERVER_KEY=$GEM_SERVER_KEY" --volume ".:/work" invoicing-invoicing /bin/bash -c 'cd /work && rake publish'
# docker run --rm -e "RBENV_VERSION=3.0.7" -e "GEM_SERVER_KEY=$GEM_SERVER_KEY" -e "BUNDLE_GEMS__RU__AEGEAN__GR=$BUNDLE_GEMS__RU__AEGEAN__GR" --volume ".:/work" invoicing-invoicing /bin/bash -c 'cd /work && bundle config set --local path local_gems && bundle && bundle update'
.deploy_gem: &_deploy_gem
  resource_group: production
  stage: deploy
  before_script:
    # No `cd` here: hyperstack:gem:publish resolves ruby/$COMPONENT itself, so the
    # same task works from CI and from a developer's checkout.
    - git config --global --add safe.directory $CI_PROJECT_DIR
  environment:
    name: production
    url: https://gitlab.ru.aegean.gr/ru/rubygems/-/packages
  when: manual
  allow_failure: true
  script:
    - echo deploying $COMPONENT
    # Was `gem build` + a `gem push --host https://michail:$GEM_SERVER_KEY@...`
    # line that was Ruby syntax pasted into a shell script -- `#{...}` does not
    # interpolate in bash, so it pushed a literally-named file to geminabox,
    # which has been retired anyway. Both publishing paths (this and
    # `rake publish`) now share one implementation. (#49)
    #
    # Credential: reuses BUNDLE_GEMS__RU__AEGEAN__GR, the group variable CI
    # already has for `source "https://gems.ru.aegean.gr"` -- that host IS the
    # GitLab registry now, so there is no second secret to provision. Set
    # GEM_SERVER_TOKEN to override with a differently-scoped token. If the
    # credential turns out to be read-only the upload fails loudly with the
    # HTTP status, rather than appearing to succeed.
    - rake hyperstack:gem:publish COMPONENT=$COMPONENT





# Guards the "one table, two consumers" contract from #51: the cells declared in
# supported_versions.yml must be exactly the cells CI runs. Cheap, no services.
supported-versions:
  # Deliberately does NOT extend .test_gem: that template now carries the
  # per-cell `parallel: matrix:` axis, and this check is about the table itself,
  # so it should run once per pipeline rather than once per cell.
  interruptible: true
  stage: test
  variables:
    COMPONENT: hyperstack-config
  before_script:
    - echo "checking supported_versions.yml against the pipeline"
  script:
    # The SupportedVersions specs themselves run in the hyperstack-config job,
    # which has a bundle; this job only needs rake and the two files.
    - rake hyperstack:matrix:check
    # Same rule for the gem list: PUBLISHED_GEMS in the Rakefile and the
    # `*-deploy` jobs below are one list with two consumers, and this is what
    # stops them drifting. It belongs here rather than on the deploy jobs
    # because those are `when: manual` and `allow_failure: true` -- a check that
    # only runs when someone starts a deploy, and cannot fail the pipeline when
    # it does, would not be a gate at all. `rake publish` takes it as a
    # prerequisite for the same reason.
    - rake hyperstack:gem:check

hyper-spec:
  extends: .test_gem
  variables:
    COMPONENT: hyper-spec
# One job runs all 7 batches in PARALLEL across a pool of PARALLEL_PROCESSES
# databases, with the Opal bundle precompiled once (see ruby/hyper-model/Rakefile
# spec:parallel). Set PARALLEL_SPECS: "0" to fall back to the serial path
# (all batches in one process). part1..part7 remain as ad-hoc per-batch rake tasks.
hyper-model:
  extends: .test_gem
  variables:
    COMPONENT: hyper-model
    TASK: spec
    DB: hyper_mesh_test_db
    # postgresql, per spec/test_app/config/database.yml. The Rakefile creates the
    # per-process hyper_mesh_test_db<N> itself; the unsuffixed one it expects to
    # already exist, which is what PG_CREATE_DB does. (#116)
    NEEDS_PG: "1"
    PG_CREATE_DB: hyper_mesh_test_db
    PRECOMPILED_ASSETS: "1"
    # 4 -> 2. Each parallel process runs its own Chrome, so this job alone held
    # 4 browsers, and ten cells of it held ~40 on a 16-core / 32 GB host that
    # also runs ru/hyperstack-addons. On 2026-08-30 that tipped over: jobs died
    # with `Killed` and `exit code 137` -- SIGKILL from the kernel OOM-killer,
    # not a spec failure, not `tab crashed`. 38 of 121 jobs on one pipeline.
    #
    # Halving the processes halves this job's peak browser count. It costs
    # wall-clock per job (the batches share fewer workers) and buys the run
    # actually finishing, which at 249 attempts for 121 jobs it was not.
    #
    # This is a mitigation, not the fix. The real levers are the runner `limit`
    # in ru/infrastructure (17 slots today, shared with hyperstack-addons) and
    # #58's reduced default matrix. Raise this again once either lands. (#113)
    PARALLEL_PROCESSES: "2"
# hyper-trace has NO test job on purpose. It has no `spec/` directory and never
# has -- the gem was imported in 2018 without one -- so its job ran bare `rake`,
# which hit the no-op `task :default do end` in its Rakefile and exited 0 in 1.4s
# having run zero examples. Ten cells of that per pipeline reported the gem green
# on the whole support matrix while testing nothing at all. A false green is worse
# than no job, so the job is gone rather than kept as decoration. (#121)
#
# Nothing is lost by removing it. hyper-component and hyper-model both carry
# hyper-trace as a path dependency with no `require: false`, so `Bundler.require`
# loads it and `Hyperstack.import 'hyper-trace'` compiles it into their test_apps'
# client bundles -- on all ten cells. Whatever load-and-compile smoke coverage the
# gem has always came from those two suites, never from this job.
#
# `hyperstack:gem:check` now asserts this absence deliberately: hyper-trace is
# listed in UNTESTED_BY_CI in the Rakefile, and the check fails if a gem in that
# list gains a test job, or if any other published gem loses one.
hyperstack-config:
  extends: .test_gem
  variables:
    COMPONENT: hyperstack-config
hyper-state:
  extends: .test_gem
  variables:
    COMPONENT: hyper-state
hyper-component:
  extends: .test_gem
  variables:
    COMPONENT: hyper-component
hyper-router:
  extends: .test_gem
  variables:
    COMPONENT: hyper-router
hyper-store:
  extends: .test_gem
  variables:
    COMPONENT: hyper-store
hyper-operation:part1:
  extends: .test_gem
  variables:
    COMPONENT: hyper-operation
    TASK: part1
    PRECOMPILED_ASSETS: "1"
    # The one gem that needs both, and until #116 the one declaring neither: its
    # test_app is postgresql (test_hyper_operation_db<N>, created by its own
    # Rakefile's `rails db:setup`, so no PG_CREATE_DB), and aaa_run_first's
    # connection_spec/transports_spec run every example twice --
    # `%i[redis active_record].each` -- against the gem's own :redis connection
    # adapter. Nothing else in the repo talks to Redis: every test_app's cable.yml
    # uses `adapter: async` in test.
    NEEDS_PG: "1"
    NEEDS_REDIS: "1"
# part2 (the 12 independent specs) runs in PARALLEL by default across a pool of
# PARALLEL_PROCESSES databases; set PARALLEL_SPECS: "0" to fall back to serial.
# part1 (aaa_run_first) stays serial above.
hyper-operation:part2:
  extends: .test_gem
  variables:
    COMPONENT: hyper-operation
    TASK: part2
    PRECOMPILED_ASSETS: "1"
    # Postgres for the same reason as part1. Redis is deliberately NOT started
    # here: only aaa_run_first (part1) sets `config.connection = { adapter:
    # :redis }`, the default is :active_record, and spec_helper's flushdb is
    # guarded on the adapter actually being :redis. A part2 spec that later wants
    # Redis has to say so here -- which is the point of the gating. (#116)
    NEEDS_PG: "1"
    # 3 -> 2, same reasoning as hyper-model above: one Chrome per process, and
    # this job's ten cells were among the OOM casualties. (#113)
    PARALLEL_PROCESSES: "2"
hyper-i18n:
  extends: .test_gem
  variables:
    # No services. This job extended the Postgres template and created
    # hyper_mesh_test_db for years; its test_app is db/test.sqlite3 and it has
    # never opened a Postgres connection. (#116)
    COMPONENT: hyper-i18n
rails-hyperstack:
  extends: .test_gem
  variables:
    COMPONENT: rails-hyperstack



# Dependency image per cell (#57). MANUAL and additive: nothing in the normal
# pipeline depends on it yet, so it cannot break a test run. Run it to publish
# an image, then measure a job against the 57.9s restore_cache baseline before
# wiring anything to consume it.
#
# Build args come from supported_versions.yml via `rake hyperstack:cell:env`, so
# the image and the test run are parameterised from the same table.
build-cell-image:
  stage: images
  allow_failure: true
  # Rebuild only when the image's inputs change -- exactly the files
  # prepare-context.sh stages. Building four cells on every pipeline would cost
  # ~4 min each and hand back most of what consuming the image saves.
  #
  # This is also what stops the image drifting from the table: supported_versions.yml
  # is baked in at BUILD time, so a purely manual build would let the table advance
  # while pipelines silently kept testing the old versions -- the drift #51 exists to
  # prevent, reintroduced by the back door. cell_contract_spec is the backstop (it
  # asserts the running cell matches the table, reading React from the browser), but
  # this rule is what keeps it from ever firing.
  rules:
    - changes:
        - supported_versions.yml
        - ruby/*/*.gemspec
        - ruby/*/Gemfile
        # The pinned gems spec:prepare needs in GEM_HOME, baked in since #73.
        # Staged by prepare-context.sh like the Gemfiles above, so editing it
        # has to rebuild for the same reason: otherwise the pins advance while
        # the images keep serving the old ones.
        - ruby/rails-hyperstack/spec_prepare_gems.rb
        - docker/cell-image/**/*
    - when: manual   # always available on demand
  # No dind service and no DOCKER_HOST: the group runners mount the host docker
  # socket, which is how ru/infrastructure builds base24 (its .gitlab-ci.yml has
  # the dind service commented out yet runs `docker info` / `docker ps`
  # directly). The first attempt here used dind and failed with
  #   Head "http://docker:2375/_ping": connect: no route to host
  # because privileged containers are not available. Building through the host
  # daemon also puts the image straight into ru-vm2's local store, which is
  # where we want it.
  # Client only -- the build runs on ru-vm2's daemon through the mounted
  # socket. Pinned to match that daemon (`docker info` in job 40528 reported
  # Server Version 29.7.2) so client and server do not drift apart.
  image: docker:29.7.2
  variables:
    CELL_IMAGE_PREFIX: $CI_REGISTRY_IMAGE/cell
  parallel:
    matrix:
      - HYPERSTACK_CELL: [rails61-react16, rails61-react17, rails61-react18, rails72-react16, rails61-react19, rails72-react19, rails80-react19-ruby40, rails80-react19-ruby34, rails81-react19-ruby34, rails81-react19-ruby40]
  before_script:
    - apk add --no-cache bash git ruby ruby-rake
    - docker info    # fail fast and legibly if the socket is not mounted
    # Docker CLI 29+ reads $DOCKER_AUTH_CONFIG and lets it OVERRIDE `docker
    # login` -- it prints "Warn -> DOCKER_AUTH_CONFIG is set and takes
    # precedence." and then ignores the credentials just stored. 27.3.1 ignored
    # the variable entirely (it was only ever a GitLab Runner concept for the
    # executor's own image pulls), so this surfaced the moment the client was
    # pinned to match the 29.7.2 daemon.
    #
    # The group value is a `read_registry` deploy token, so the login below
    # succeeds and is then discarded, and the push fails with
    #   denied: requested access to the resource is denied
    #   unauthorized: authentication required
    # after happily uploading every layer (job 40810). The executor has already
    # used the variable to pull this job's image by now; from here the job needs
    # the job token, which is the credential allowed to write.
    - unset DOCKER_AUTH_CONFIG
    # Retried because the JWT auth endpoint occasionally resets the connection:
    #   Error response from daemon: Get "https://registry.ru.aegean.gr/v2/":
    #   Get "https://gitlab.ru.aegean.gr/jwt/auth?...": read tcp ...: connection
    #   reset by peer
    # (job 52433; the same job passed 63s later on a manual retry). The job is
    # `allow_failure: true`, so an unretried reset does not go red -- it leaves
    # the cell testing against the PREVIOUS image, with supported_versions.yml
    # baked in at the older revision. That is the drift the `rules:` block above
    # exists to prevent, so a one-off network blip must not be able to cause it.
    #
    # A job-level `retry:` is the wrong instrument: it reruns the whole build,
    # and covering this would mean retrying `script_failure`, which .test_gem
    # deliberately does not do (see the retry comment there). (#94)
    - |
      for attempt in 1 2 3; do
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY" && break
        if [ "$attempt" = 3 ]; then
          echo "docker login to $CI_REGISTRY failed after 3 attempts"
          exit 1
        fi
        echo "docker login attempt $attempt failed; retrying in $((attempt * 5))s"
        sleep $((attempt * 5))
      done
  script:
    - bash docker/cell-image/build.sh --push

