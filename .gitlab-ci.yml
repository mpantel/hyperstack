image:
  name: ${PRIVATE_REGISTRY}/base24:yjit
  docker:
    user: ubuntu

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_MESSAGE =~ /\[ci build]/i
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =='master'

variables:
  # Point yarn's download cache inside the project dir so GitLab can cache it
  # (cache paths must be under $CI_PROJECT_DIR). Set as a variable rather than
  # `yarn config set` so it is inherited by the yarn runs the install generator
  # makes inside the generated test app, not just the one in before_script. (#55)
  YARN_CACHE_FOLDER: "$CI_PROJECT_DIR/.yarn-cache"

  TERM: ansi
  MOUNT_PATH: /home/michail
  CONTAINER_SUBNET: 192.168.48.0/24

  PGUSE: postgres
  PGPORT: 5432
  PGHOST: localhost
#  RUBYOPT: "-W0"
  RUBYOPT: "-W:deprecated"

  OPAL_VERSION: 1.8.3
  RBENV_VERSION: 3.4.9

  # mini_racer is disabled, so server-side prerendering is gated off in specs
  # (render_on: :both/:server_only fall back to client-only). Re-enable tracked
  # in the "restore server-side prerendering" issue.
  HYPER_SPEC_PRERENDERING: "off"
  RUBY_YJIT_ENABLE: "1"

  DISABLE_SPRING: "1"
  NODE_OPTIONS: "--openssl-legacy-provider"

